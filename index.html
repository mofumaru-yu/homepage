<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>もふまるず紹介</title>
  <script src="https://unpkg.com/vue@3.2.37/dist/vue.global.js"></script>

  <style>
@media all and (min-width: 1000px){
  .all_waku {
    width: 1300px;
    height: 900px;
    display: flex;
  }

  .list {
    width: 300px;
    height: 900px;
    background-color: rgb(255, 225, 166);
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
  }

  .right_waku {
    width: 1000px;
    height: 900px;
    background-color: rgb(255, 225, 166);
    display: flex;
    flex-direction: column;
  }

  .i1 {
    width: 1000px;
    height: 700px;
    position: relative;
    overflow: hidden;
  }

  .lnk {
    height: 150px;
  }
}

@media all and (max-width: 1000px){
  .all_waku {
    width: 1000px;
    height: 1200px;
    display: flex;
    flex-wrap: wrap;
  }

  .list {
    width: 1000px;
    height: 250px;
    background-color: rgb(255, 225, 166);
    display: flex;
    flex-wrap: wrap;
  }

  .right_waku {
    width: 1000px;
    height: 950px;
    background-color: rgb(255, 225, 166);
  }

  .i1 {
    width: 1000px;
    height: 700px;
    position: relative;
    overflow: hidden;
  }

  .lnk {
    height: 150px;
  }
}

.char-btn {
  width: 135px;
  height: 40px;
  border-radius: 4px;
  background-size: 100%;
  border: 1px solid rgb(90, 90, 90);
  cursor: pointer;
  margin: 4px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.char-btn.active {
  border: 3px solid #ff7a00;
  box-shadow: 0 0 10px rgba(255, 122, 0, 0.8);
  transform: scale(1.05);
}

/* ★フェード演出 */
.fade-enter-active,
.fade-leave-active {
  transition: opacity 0.4s ease;
}

.fade-enter-from,
.fade-leave-to {
  opacity: 0;
}
  </style>
</head>

<body>
<div id="app">
  <div class="all_waku">

    <!-- 左：キャラ一覧 -->
    <div class="list">
      <div
        v-for="n in chars"
        :key="n"
        class="char-btn"
        :class="{ active: current === n }"
        :style="`background-image:url(./data/c${n}/bana.jpg)`"
        @click="show(n)"
      ></div>
    </div>

    <!-- 右：表示エリア -->
    <div class="right_waku">
      <div class="data1">
        <p>
          リンク集：
          <a href="https://x.com/mofumaru_yu" target="_blank">X(Twitter)</a>
          <a href="https://www.pixiv.net/users/3103617" target="_blank">Pixiv</a>
          <a href="https://skeb.jp/@mofumaruyu" target="_blank">Skeb</a>
          ポートフォリオ→<a href="./port.html">●</a>
        </p>
      </div>

      <!-- ★フェード付き画像 -->
      <div class="i1">
        <transition name="fade" mode="out-in">
          <img
            :key="imgSrc"
            :src="imgSrc"
            width="1000"
            height="700"
          >
        </transition>
      </div>

      <div class="lnk">
        <p>うちの子一問一答</p>
        <object :data="textSrc" type="text/HTML" width="100%" height="100%"></object>
      </div>
    </div>

  </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const chars = Array.from({ length: 34 }, (_, i) => i + 1);

    const imgSrc = ref("");
    const textSrc = ref("");
    const current = ref(1);

    const show = (n) => {
      current.value = n;
      imgSrc.value = `./data/c${n}/chara1.jpg`;
      textSrc.value = `./data/c${n}/text.txt`;
    };

    onMounted(() => {
      show(1);
    });

    return {
      chars,
      imgSrc,
      textSrc,
      current,
      show
    };
  }
}).mount("#app");
</script>
</body>
</html>
